<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="images/InternTrack.png" />

    <title>InternTrack | Sign Up</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          Segoe UI,
          Tahoma,
          Geneva,
          Verdana,
          sans-serif;
      }

      body {
        background: #fff9f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .signup-container {
        width: 100%;
        max-width: 430px;
        padding: 20px;
      }

      .signup-card {
        width: 100%;
        max-width: 380px;
        background: white;
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      }

      .logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 35px;
      }

      .logo img {
        width: 70px;
        height: 70px;
        object-fit: contain;
        border-radius: 10px;
        margin-bottom: 15px;
      }

      .logo h1 {
        color: #005f73;
        font-size: 32px;
      }

      .logo p {
        color: #666;
        margin-top: 8px;
      }

      .input-group {
        margin-bottom: 20px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #005f73;
        font-weight: 600;
      }

      .input-group input {
        width: 100%;
        padding: 10px 14px;
        border: 2px solid #ddd;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
      }

      .input-group input:focus {
        border-color: #0a9396;
      }

      .terms {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 18px 0 22px;
        font-size: 14px;
        color: #555;
      }

      .terms input {
        margin-top: 3px;
      }

      .terms a {
        color: #005f73;
        text-decoration: none;
      }

      .terms a:hover {
        color: #0a9396;
      }

      .signup-btn {
        width: 100%;
        background: #ee9b00;
        color: white;
        border: none;
        padding: 16px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: 0.3s;
      }

      .signup-btn:hover {
        background: #d98f00;
      }

      .login {
        text-align: center;
        margin-top: 22px;
        color: #555;
      }

      .login a {
        color: #005f73;
        text-decoration: none;
        font-weight: bold;
      }

      .login a:hover {
        color: #0a9396;
      }

      .back-home {
        text-align: center;
        margin-top: 18px;
      }

      .back-home a {
        color: #005f73;
        text-decoration: none;
      }

      .back-home a:hover {
        color: #0a9396;
      }
    </style>
  </head>

  <body>
    <div class="signup-container">
      <div class="signup-card">
        <div class="logo">
          <img src="images/InternTrack.png" alt="InternTrack" />

          <h1>InternTrack</h1>

          <p>Create your account</p>
        </div>

        <form>
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required />
          </div>

          <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required />
          </div>

          <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Create a password" required />
          </div>

          <div class="input-group">
            <label>Confirm Password</label>
            <input
              type="password"
              placeholder="Confirm your password"
              required
            />
          </div>

          <div class="terms">
            <input type="checkbox" required />
            <span
              >I agree to the <a href="#">Terms of Service</a> and
              <a href="#">Privacy Policy</a>.</span
            >
          </div>

          <button class="signup-btn">Create Account</button>
        </form>

        <div class="login">
          Already have an account?

          <a href="login.html"> Log In </a>
        </div>

        <div class="back-home">
          <a href="index.html"> Back to Home </a>
        </div>
      </div>
    </div>
  </body>
</html>
