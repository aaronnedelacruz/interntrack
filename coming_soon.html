<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon | InternTrack</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: linear-gradient(135deg, #f4fbfc, #ffffff);
        color: #0f172a;
        min-height: 100vh;
      }

      /* NAVBAR */

      nav {
        background: #005f73;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 8%;
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 28px;
        font-weight: bold;
        color: #ee9b00;
      }

      .logo a {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: #ee9b00;
        font-weight: bold;
      }

      .logo img {
        width: 42px;
        height: 42px;
        object-fit: contain;
        border-radius: 5px;
      }

      nav ul {
        display: flex;
        align-items: center;
        gap: 28px;
        list-style: none;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
      }

      nav a:hover {
        color: #ee9b00;
      }

      .auth-buttons {
        display: flex;
        gap: 12px;
      }

      .logo img {
        width: 42px;
        height: 42px;
      }

      nav ul {
        display: flex;
        list-style: none;
        gap: 30px;
      }

      .login-btn {
        background: #ee9b00;
        color: white;
        padding: 10px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
      }

      .login-btn:hover {
        background: #d98f00;
      }

      /* MAIN */

      .coming-soon {
        min-height: calc(100vh - 78px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 80px 8%;
      }

      .coming-card {
        max-width: 700px;
        width: 100%;
        background: white;
        padding: 60px;
        border-radius: 18px;
        border: 3px solid #088587;
        box-shadow: 0 15px 35px rgba(0, 95, 115, 0.12);
        text-align: center;
      }

      .coming-card h1 {
        font-size: 56px;
        color: #005f73;
        margin-bottom: 20px;
      }

      .coming-card p {
        font-size: 18px;
        line-height: 1.8;
        color: #5b6670;
        margin-bottom: 40px;
      }

      .back-btn {
        display: inline-block;
        text-decoration: none;
        background: #ee9b00;
        color: white;
        padding: 15px 34px;
        border-radius: 10px;
        font-weight: 600;
        transition: 0.3s;
      }

      .back-btn:hover {
        background: #d98f00;
      }

      @media (max-width: 768px) {
        .coming-card {
          padding: 40px 30px;
        }

        .coming-card h1 {
          font-size: 42px;
        }

        .coming-card p {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <nav>
      <div class="logo">
        <a href="index.html">
          <img src="images/InternTrack.png" alt="InternTrack Logo" />
          <span>InternTrack</span>
        </a>
      </div>

      <ul>
        <li><a href="index.html#preview">How it Works</a></li>
        <li><a href="index.html#features">Features</a></li>
        <li><a href="index.html#faq">FAQs</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>

      <div class="auth-buttons">
        <a href="login.html" class="login-btn">Log In</a>
      </div>
    </nav>

    <section class="coming-soon">
      <div class="coming-card">
        <h1>Coming Soon</h1>

        <p>
          This page is currently under development. We're working on bringing
          this feature to InternTrack soon.
        </p>

        <a href="index.html" class="back-btn">Go Back</a>
      </div>
    </section>
  </body>
</html>
